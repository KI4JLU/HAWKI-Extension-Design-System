name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: dist/ contains no story or docs artifacts
        run: |
          if find dist -name '*.stories.*' -o -name '*.mdx' | grep -q .; then
            echo "Story/docs files leaked into dist/ (clean-dist-stories.mjs regressed):"
            find dist -name '*.stories.*' -o -name '*.mdx'
            exit 1
          fi

      - name: Build Storybook
        run: npm run build-storybook

      - name: Type-check
        run: npm run check

      - name: Every exported component has a story
        run: npm run check:story-coverage

      - name: Test (unit tests + every story)
        run: npm run test

      - name: Lint
        run: npm run lint
