name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run check

      - name: Every exported component has a story
        run: npm run check:story-coverage

      - name: Test (unit tests + every story)
        run: npm run test

      - name: Lint
        run: npm run lint
